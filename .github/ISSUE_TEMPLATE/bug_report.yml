name: Bug report
description: A card is in the wrong column, the server misbehaves, or the hook does the wrong thing.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Session data without the token, or the token reaching another origin or port, is a
        security bug. Report it privately as SECURITY.md describes, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the board showed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: What you did in the session (a prompt, a permission prompt, Esc, a subagent).
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant log lines
      description: The matching lines from `~/.claude/board/events.jsonl`. Remove anything private.
      render: text
  - type: input
    id: board-version
    attributes:
      label: board version
      description: From `claude plugin list`.
      placeholder: "0.1.3"
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: From `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (Git Bash)
        - Windows (WSL)
        - Other
    validations:
      required: true
