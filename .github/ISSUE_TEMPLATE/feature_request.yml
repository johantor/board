name: Feature request
description: A new column, card detail, filter or option, or a change to how the board works.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you wanted to see or do, and where the board fell short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workaround today
      description: How you get by without it, if at all.
